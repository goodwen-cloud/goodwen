<svg xmlns="http://www.w3.org/2000/svg" width="780" height="508" viewBox="0 0 780 508" role="img" aria-labelledby="title description" lang="zh-CN">
  <title id="title">一份问卷，两种发放方式</title>
  <desc id="description">以服务体验回访为例，先给智能体服务资料，生成两道题并预览。现场发放让同一网络的手机作答，答卷保存在发起人的电脑。公网发放将当前版本保存到 Goodwen，由负责人审核后取得链接，关机后仍可收卷。最后按版本查看并分析回答。</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#cabdab"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#776b65" stroke-width="1.4" stroke-linejoin="round"/></marker>
    <g id="document" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h10l5 5v16H6zM16 3v6h5M10 13h7m-7 4h7"/></g>
    <g id="pencil" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 22 1-6L18 4a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L10 20zM15 7l5 5M4 24h18"/></g>
    <g id="preview" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="23" height="17" rx="3"/><path d="M9 25h9m-5-4v4m-7-13 4 4 8-8"/></g>
    <g id="wifi" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9a17 17 0 0 1 24 0M6 14a11 11 0 0 1 16 0m-12 5a5.5 5.5 0 0 1 8 0"/><circle cx="14" cy="23" r="1.7" fill="currentColor" stroke="none"/></g>
    <g id="world" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="14" cy="14" r="12"/><ellipse cx="14" cy="14" rx="5.5" ry="12"/><path d="M2 14h24M5 7.5c6 3 12 3 18 0M5 20.5c6-3 12-3 18 0"/></g>
    <g id="results" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v21h23M8 18v-5m6 5V7m6 11v-8"/></g>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#322e31}
      .title{font-size:30px;font-weight:750}.step{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#625953}
      .lane{font-size:23px;font-weight:720}.row{font-size:17px;font-weight:520}.note{font-size:15px}
      .connector{fill:none;stroke:#776b65;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="778" height="506" rx="23" fill="#fffcf7" stroke="#ddd4c8"/>
  <path d="M643 2h114a20 20 0 0 1 20 20v46H643z" fill="url(#dots)" opacity=".62"/>
  <text class="title" x="26" y="47">一份问卷，两种发放方式</text>
  <rect x="26" y="72" width="728" height="84" rx="12" fill="#fff" stroke="#e2d9cc"/>
  <g color="#64514e">
    <use href="#document" x="43" y="98"/><use href="#pencil" x="290" y="98"/><use href="#preview" x="532" y="98"/>
  </g>
  <text class="step" x="80" y="109">选定材料</text><text class="sub" x="80" y="134">服务说明与回访目标</text>
  <text class="step" x="326" y="109">生成问卷</text><text class="sub" x="326" y="134">一道单选，一句建议</text>
  <text class="step" x="571" y="109">作者预览</text><text class="sub" x="571" y="134">核对题目与作答规则</text>
  <g class="connector" marker-end="url(#arrow)"><path d="M233 113h33"/><path d="M478 113h32"/></g>
  <path class="connector" d="M646 156v16q0 6-6 6H210q-6 0-6 6v13" marker-end="url(#arrow)"/>
  <path class="connector" d="M575 178v19" marker-end="url(#arrow)"/>
  <circle cx="575" cy="178" r="3" fill="#776b65"/>
  <rect x="26" y="202" width="352" height="194" rx="14" fill="#eaf3ec" stroke="#b6d1bf"/>
  <rect x="402" y="202" width="352" height="194" rx="14" fill="#fff0ea" stroke="#e6b6ac"/>
  <g color="#255a46"><use href="#wifi" x="46" y="221"/></g>
  <g color="#953956"><use href="#world" x="422" y="221"/></g>
  <text class="lane" x="86" y="245">现场收卷</text><text class="lane" x="463" y="245">公网收卷</text>
  <g fill="none" stroke="#8bb59c" stroke-width="1.6"><path d="M57 270v64"/><circle cx="57" cy="273" r="4" fill="#eaf3ec"/><circle cx="57" cy="303" r="4" fill="#eaf3ec"/><circle cx="57" cy="333" r="4" fill="#347054" stroke="none"/></g>
  <g fill="none" stroke="#d497a4" stroke-width="1.6"><path d="M433 270v64"/><circle cx="433" cy="273" r="4" fill="#fff0ea"/><circle cx="433" cy="303" r="4" fill="#fff0ea"/><circle cx="433" cy="333" r="4" fill="#a64864" stroke="none"/></g>
  <g class="row"><text x="76" y="280">选择「在局域网发放」</text><text x="76" y="310">同一 Wi-Fi 下用手机打开链接</text><text x="76" y="340">答卷保存在发起人的电脑</text>
    <text x="451" y="280">注册或登录 Goodwen 并授权</text><text x="451" y="310">负责人在网页审核并确认发布</text><text x="451" y="340">取得公网填写链接，发给客户</text></g>
  <path d="M47 355h309m68 0h308" fill="none" stroke="#b7a99e" opacity=".55"/>
  <text class="note" x="48" y="380" style="fill:#315640">收卷期间保持电脑和本地服务运行</text>
  <text class="note" x="424" y="380" style="fill:#87394e">发布后，电脑关机也能继续收卷</text>
  <path class="connector" d="M203 396v11q0 5 5 5h365q5 0 5-5v-11M390 412v14" marker-end="url(#arrow)"/>
  <rect x="26" y="431" width="728" height="53" rx="12" fill="#332e36"/>
  <g color="#ffd477"><use href="#results" x="47" y="445"/></g>
  <text x="88" y="465" style="font-size:20px;font-weight:700;fill:white">查看这一版的答卷</text>
  <text x="304" y="465" style="font-size:17px;fill:#f3e8e3">汇总满意度，引用具体建议，决定先改哪一项</text>
</svg>
