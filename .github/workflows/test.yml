name: Verify Goodwen Local
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tools/build_release.py --platform ${{ matrix.platform }}
      - name: Extract the complete skill
        run: python -m zipfile -e dist/goodwen-local-0.1.0-${{ matrix.platform }}.zip unpacked
      - name: Validate with the offline runtime
        if: runner.os != 'Windows'
        run: sh unpacked/goodwen-local/scripts/run.sh validate unpacked/goodwen-local/examples/feedback/quiz.md
      - name: Validate with the offline runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\unpacked\goodwen-local\scripts\run.ps1 validate .\unpacked\goodwen-local\examples\feedback\quiz.md'
