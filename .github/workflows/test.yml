name: Verify Goodwen
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tools/build_release.py --platform ${{ matrix.platform }}
      - name: Extract the complete skill
        shell: python
        run: |
          import json
          from pathlib import Path
          from zipfile import ZipFile
          version = json.loads(Path("skills/goodwen/scripts/runtime-lock.json").read_text())["version"]
          with ZipFile(f"dist/local/goodwen-local-{version}-${{ matrix.platform }}.zip") as package:
              package.extractall("unpacked")
      - name: Validate with the offline runtime
        if: runner.os != 'Windows'
        run: sh unpacked/goodwen/scripts/run.sh validate unpacked/goodwen/examples/feedback/quiz.md
      - name: Validate with the offline runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\unpacked\goodwen\scripts\run.ps1 validate .\unpacked\goodwen\examples\feedback\quiz.md'
